name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [ruff, mypy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]" vendor/blueprint_linters-*.whl
      - name: Verify C extensions built
        if: matrix.check == 'mypy'
        run: python -c "from pygraphc._core import cc_ctx; from pygraphc._dag_learn import hill_climb_k2"
      - name: ruff check
        if: matrix.check == 'ruff'
        run: ruff check src/ tests/ && ruff format --check src/ tests/
      - name: mypy
        if: matrix.check == 'mypy'
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      # Every interpreter reports: a failure on one version must not cancel the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]" vendor/blueprint_linters-*.whl
      - name: Unit tests
        run: pytest tests/unit_tests/ -x -v --cov=src --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # Reads the complexity matrix off the directory so that adding a test file
  # is enough to make it run. A hand-written list had silently stopped running
  # two of the nine files of the earlier walltime suite.
  complexity-files:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - name: List the complexity test files
        id: list
        run: |
          set -o pipefail
          files=$(ls tests/performance_tests/complexity/test_*.py | xargs -n 1 basename |
            jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "$files"

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]" vendor/blueprint_linters-*.whl
      # The test job runs only tests/unit_tests/ and both pre-commit hooks pass
      # -m "not integration", so this is the only place the domain cases run.
      # The directory is named without a marker filter, so no deselect rule can
      # exclude it and a case that forgets the marker still runs; pytest exits 5
      # when nothing is collected, so an empty directory fails rather than
      # passing quietly.
      - name: Integration cases
        run: pytest tests/integration_tests/ -x -v

  # Deterministic tier: callgrind instruction counts of the scenarios and of
  # every workflow phase, branch against merge base, both built the same way in
  # this job, so a toolchain bump never shows up as a change. Any changed count
  # fails; a pull request labelled accept-instruction-change still prints the
  # table but does not fail.
  instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build the merge base and the branch
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          base=$(git merge-base "$BASE_REF" HEAD)
          # A push to main is its own merge base: compare with the commit before it.
          if [ "$base" = "$(git rev-parse HEAD)" ]; then base=$(git rev-parse HEAD^); fi
          git worktree add "$RUNNER_TEMP/base" "$base"
          # Both interpreters get exactly the same packages: a different set of
          # installed modules shifts the heap layout and the counts by about 1%.
          python -m venv "$RUNNER_TEMP/base-venv"
          "$RUNNER_TEMP/base-venv/bin/pip" install "$RUNNER_TEMP/base" pytest
          python -m venv "$RUNNER_TEMP/head-venv"
          "$RUNNER_TEMP/head-venv/bin/pip" install . pytest
      - name: Instruction counts against the merge base
        working-directory: tests
        env:
          ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'accept-instruction-change') }}
        run: |
          "$RUNNER_TEMP/head-venv/bin/python" -m performance_tests.instructions.compare \
            --base-python "$RUNNER_TEMP/base-venv/bin/python" \
            --head-python "$RUNNER_TEMP/head-venv/bin/python" || [ "$ACCEPTED" = "true" ]
      - name: Design and memory claims
        working-directory: tests
        run: '"$RUNNER_TEMP/head-venv/bin/pytest" performance_tests/instructions -v'

  # Walltime at rising sizes, asserting the scaling exponent: superlinear
  # behaviour only shows on inputs too large for callgrind.
  complexity:
    needs: complexity-files
    runs-on: ubuntu-latest
    strategy:
      # Every file reports: a failure in one must not cancel the others.
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.complexity-files.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install ".[dev]"
      - name: Complexity tests
        working-directory: tests
        env:
          COMPLEXITY_FILE: ${{ matrix.file }}
        # -s keeps every measurement in the log: the calibration record of the runner.
        run: pytest "performance_tests/complexity/$COMPLEXITY_FILE" -v -s

  # One realistic large input per workflow against a generous budget.
  experience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install ".[dev]"
      - name: Customer experience tests
        working-directory: tests
        run: pytest performance_tests/experience -v

  profiles:
    runs-on: ubuntu-latest
    # Off the critical path on purpose: the uploaded artifact is the point, the
    # timing on a shared runner is not, so this job never gates a merge. The
    # guard is the instructions job, which counts every phase of these
    # workflows against the merge base.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev,benchmark]" vendor/blueprint_linters-*.whl
      - name: Workflow profiles
        run: python benchmarks/profile_workflows.py --size guard --output profiles
      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiles
          path: profiles/

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install diff-cover
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: diff-cover
        env:
          # A stacked pull request must be measured against the branch it targets,
          # not against main, or the report covers the whole stack's diff.
          COMPARE_BRANCH: origin/${{ github.base_ref || github.ref_name }}
        run: diff-cover coverage.xml --compare-branch="$COMPARE_BRANCH" --fail-under=80
